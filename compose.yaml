services:
  simulator-api:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0@sha256:7067050693f49d377d91ca91f2faa6e63f673f69a69429d4693e78e9c0598e92
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports:
      - "127.0.0.1:${SIMULATOR_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/v1/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20

  snapshot-api:
    build: ./backend
    environment:
      SIMULATOR_BASE_URL: http://simulator-api:8000
      APPROVAL_DB: /data/approvals.sqlite3
      ML_SERVICE_URL: ${ML_SERVICE_URL:-}
      MODEL_MANIFEST_PATH: /meta/model-manifest.json
      EVAL_ARTIFACTS_DIR: /eval
      EVIDENCE_DIR: /evidence
      PLANNING_CACHE_TTL_SECONDS: ${PLANNING_CACHE_TTL_SECONDS:-2.0}
      SIMULATOR_TIMEOUT_SECONDS: ${SIMULATOR_TIMEOUT_SECONDS:-3.0}
      ML_FORECAST_TIMEOUT_SECONDS: ${ML_FORECAST_TIMEOUT_SECONDS:-8.0}
      OPERATOR_AUTH_MODE: ${OPERATOR_AUTH_MODE:-local_open}
      OPERATOR_USERNAME: ${OPERATOR_USERNAME:-operator}
      OPERATOR_PASSWORD_HASH: ${OPERATOR_PASSWORD_HASH:-}
      OPERATOR_TOKEN_SHA256: ${OPERATOR_TOKEN_SHA256:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - approvals:/data
      - ./ml-service/model-manifest.json:/meta/model-manifest.json:ro
      - ./artifacts/evaluation:/eval:ro
      - ./docs/evidence:/evidence:ro
    depends_on:
      simulator-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SNAPSHOT_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20

  operator-dashboard:
    build: ./frontend
    depends_on:
      snapshot-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 3s
      timeout: 3s
      retries: 20

  ml-service:
    profiles: ["ml"]
    build: ./ml-service
    environment:
      CHRONOS_MODEL_DIR: /models/chronos-2
      IFOREST_ARTIFACT_PATH: /app/artifacts/isolation_forest.joblib
      MODEL_MANIFEST_PATH: /app/model-manifest.json
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./ml-service/weights:/models:ro
      - ./ml-service/artifacts:/app/artifacts:ro
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8002/health/live', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.2.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      snapshot-api:
        condition: service_healthy

volumes:
  approvals:
