name: Release images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build versioned images
        shell: bash
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_url="https://github.com/${GITHUB_REPOSITORY,,}"
          docker build --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=$source_url" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$prefix-backend:$GITHUB_REF_NAME" backend
          docker build --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=$source_url" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$prefix-dashboard:$GITHUB_REF_NAME" frontend
      - name: Publish to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker push "$prefix-backend:$GITHUB_REF_NAME"
          docker push "$prefix-dashboard:$GITHUB_REF_NAME"

  verify_release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Pull and smoke-test release images in Compose
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          export BUP_IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          export BUP_RELEASE_TAG="$GITHUB_REF_NAME"
          node scripts/verify.mjs release
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-smoke
          path: artifacts/release/
          if-no-files-found: ignore
